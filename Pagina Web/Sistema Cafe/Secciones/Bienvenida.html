<h2> <span id="usuario_bienvenido"></span></h2>

<script>

    document.addEventListener('DOMContentLoaded', function() {
        
        const nombreUsuario = localStorage.getItem('usuario_actual');
        
        if (nombreUsuario) {
            document.getElementById('usuario_bienvenido').textContent = nombreUsuario;
        } else { 
            document.getElementById('usuario_bienvenido').textContent = "Operador";
        }
        
    });
</script>
